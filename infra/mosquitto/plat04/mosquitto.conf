# PLAT-04 isolated configuration for the second-bimester MQTT contract.
# The shared infra/mosquitto/config/mosquitto.conf remains unchanged.

listener 1883 0.0.0.0
allow_anonymous false
password_file /run/mosquitto/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
